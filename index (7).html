<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Coffee AI Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120E0B;--panel:#1B1510;--panel2:#241C15;--line:#352A20;--text:#F3EADF;--muted:#A39280;--accent:#E3A857;--accent2:#C97B36;--ink:#1A1109;--ok:#7BC47F;--warn:#E8B04A;--bad:#E0675A;--info:#6FB1D9;--navbg:rgba(18,14,11,.7);--navbg2:rgba(18,14,11,.94);--colbg:rgba(27,21,16,.7);--r:14px;--disp:'Unbounded','Onest',system-ui,sans-serif;--body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
:root[data-theme="light"]{--bg:#F7F0E6;--panel:#FFFBF5;--panel2:#F3E9DB;--line:#E0D0BB;--text:#2B1E13;--muted:#7A6652;--accent:#BF6A18;--accent2:#A5560F;--ink:#FFF8EE;--ok:#237A49;--warn:#94600E;--bad:#B93E32;--info:#23709E;--navbg:rgba(247,240,230,.82);--navbg2:rgba(247,240,230,.96);--colbg:rgba(255,251,245,.7);color-scheme:light}

:root[data-theme="light"] .btn.ghost{color:var(--text);background:transparent}
:root[data-theme="light"] .btn.ghost:hover{color:var(--accent)}
:root[data-theme="light"] .btn.bad{color:var(--bad);background:rgba(185,62,50,.1)}
:root[data-theme="light"] .tabs button.on{color:var(--accent);background:#fff}
:root[data-theme="light"] .chip.on{background:var(--accent);color:#FFF8EE}
:root[data-theme="light"] .badge.gold{color:#8A4E0E;border-color:rgba(191,106,24,.5);background:rgba(191,106,24,.1)}
:root[data-theme="light"] .badge.ok{border-color:rgba(35,122,73,.45);background:rgba(35,122,73,.09)}
:root[data-theme="light"] .badge.warn{border-color:rgba(148,96,14,.45);background:rgba(148,96,14,.09)}
:root[data-theme="light"] .badge.bad{border-color:rgba(185,62,50,.45);background:rgba(185,62,50,.08)}
:root[data-theme="light"] .badge.info{border-color:rgba(35,112,158,.45);background:rgba(35,112,158,.08)}
:root[data-theme="light"] .oc .cm{color:#7A4E08;background:rgba(191,106,24,.12)}
:root[data-theme="light"] .nv.on{background:linear-gradient(90deg,rgba(191,106,24,.16),rgba(191,106,24,.04))}
:root[data-theme="light"] .kpi:hover{box-shadow:0 14px 34px rgba(80,50,20,.14)}
:root[data-theme="light"] .gsr{box-shadow:0 20px 50px rgba(80,50,20,.2)}
:root[data-theme="light"] .ov{background:rgba(60,40,20,.45)}
:root[data-theme="light"] .lg{box-shadow:0 30px 80px rgba(80,50,20,.18)}
:root[data-theme="light"] .sw.on{background:rgba(35,122,73,.18)}
:root[data-theme="light"] .sw.gold.on{background:rgba(191,106,24,.2);border-color:rgba(191,106,24,.6)}
:root[data-theme="light"] .slot .tb.busy{color:#8A4E0E;background:rgba(191,106,24,.12)}
:root[data-theme="light"] .col h3 b{color:var(--text)}
/* карти, які навмисно темні (бонусна картка клієнта, перегляд Telegram) */
.loy{--text:#F3EADF;--muted:#BBA993;color:#F3EADF}
.loy .badge.gold,:root[data-theme="light"] .loy .badge.gold{color:#E3A857;border-color:rgba(227,168,87,.5);background:rgba(227,168,87,.12)}
.ph{color:#E8EEF3}
.ph .hd,.ph .bub{color:#E8EEF3}
:root[data-theme="light"] body::before{background:radial-gradient(900px 500px at 85% -10%,rgba(208,124,38,.14),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(208,124,38,.08),transparent 60%)}
:root[data-theme="light"] .btn{color:#FFF8EE}:root[data-theme="light"] .chip.on{color:#FFF8EE}
:root[data-theme="light"] .bars .b.cur i{background:linear-gradient(180deg,#F4B96A,var(--accent))}
:root[data-theme="light"] .ts{box-shadow:0 14px 40px rgba(60,40,20,.2)}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--body);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 85% -10%,rgba(227,168,87,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(201,123,54,.08),transparent 60%);z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.01em;font-weight:700}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
/* topbar */
.tbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 0;margin-bottom:10px;background:linear-gradient(180deg,var(--bg) 70%,transparent);backdrop-filter:blur(8px)}
.crumb{font-size:14px;color:var(--muted);white-space:nowrap}.crumb b{color:var(--text);font-weight:600}
.gsw{position:relative;flex:1;max-width:460px;margin-left:auto}
.gsw input{padding-left:40px;background:var(--panel)}
.gsw svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.gsr{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.55);padding:6px;max-height:340px;overflow:auto;z-index:25}
.gsr[hidden]{display:none}
.gsr button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;background:transparent;border-radius:10px;padding:9px 10px}
.gsr button:hover{background:var(--panel2)}.gsr small{margin-left:auto;color:var(--muted);font-size:12px}
.tb-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.gsw+.tb-r{margin-left:0}
.ibt{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted);transition:all .2s}
.ibt:hover{color:var(--accent);border-color:var(--accent)}.ibt svg{width:20px;height:20px}
.ibt i{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:999px;background:var(--accent);color:var(--ink);font:700 11px var(--body);display:none;place-items:center;padding:0 5px;font-style:normal}
.ibt i.show{display:grid}
.me{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.me u{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:var(--ink);font:800 14px var(--disp);text-decoration:none}
.me div{line-height:1.2;font-size:13px}.me small{display:block;color:var(--muted)}
@media (max-width:900px){.me div{display:none}.me{padding:4px}}
/* alive */
.card{position:relative;transition:transform .25s,border-color .25s,box-shadow .25s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,-60%),rgba(227,168,87,.14),transparent 70%);opacity:0;transition:opacity .3s}
.card:hover::before{opacity:1}
.kpi:hover{transform:translateY(-3px);border-color:rgba(227,168,87,.45);box-shadow:0 16px 40px rgba(0,0,0,.25)}
.spark{display:block;width:100%;height:34px;margin-top:10px}
.hello{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}
.hello h1{font-size:clamp(22px,3vw,30px)}
.hello .sub{color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.att{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.at{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);text-decoration:none;color:var(--text);transition:transform .2s,border-color .2s}
.at:hover{transform:translateY(-2px);border-color:var(--accent)}
.at .e{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:rgba(227,168,87,.14)}
.at.bad .e{background:rgba(224,103,90,.16)}.at.ok .e{background:rgba(123,196,127,.16)}.at.info .e{background:rgba(111,177,217,.16)}
.at b{display:block;font-size:14px}.at span{font-size:12.5px;color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.strip .p{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.strip .p b{color:var(--text)}
.strip .p.fl{cursor:pointer;transition:all .2s}.strip .p.fl:hover{border-color:var(--accent);color:var(--text)}
.strip .p.fl.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}.strip .p.fl.on b{color:var(--ink)}
.strip .p.lt{color:var(--bad);border-color:rgba(224,103,90,.5)}.strip .p.lt b{color:var(--bad)}.strip .p.lt.on{background:var(--bad);border-color:var(--bad);color:#fff}.strip .p.lt.on b{color:#fff}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}.ogrid .oc{margin:0}
.steam{position:absolute;left:21px;top:-1px;width:3px;height:10px;border-radius:3px;background:linear-gradient(180deg,transparent,rgba(255,243,220,.85));opacity:0;animation:steam 3s infinite}
.steam:nth-child(2){left:27px;animation-delay:1s}.steam:nth-child(3){left:33px;animation-delay:2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-10px)}}
.kbd{font:600 11px var(--body);padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);position:absolute;right:12px;top:50%;transform:translateY(-50%)}
/* login */
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:var(--bg)}
.lg{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:12px;font:800 20px var(--disp)}
.logo i{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:var(--ink);font-style:normal;font-size:20px}
.lg h2{font-size:22px;margin:26px 0 6px}.lg p{margin:0 0 20px}
.lg label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.in{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(227,168,87,.16)}
textarea.in{resize:vertical;min-height:120px;line-height:1.5}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--accent);color:var(--ink);display:inline-flex;align-items:center;gap:8px;transition:transform .15s,filter .2s,background .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.bad{background:rgba(224,103,90,.14);color:var(--bad);border:1px solid rgba(224,103,90,.35)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pwr{position:relative}.pwr .in{padding-right:48px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center;transition:color .2s,background .2s}.eye:hover{color:var(--accent);background:rgba(227,168,87,.1)}.eye[aria-pressed=true]{color:var(--accent)}.eye svg{width:20px;height:20px}
.demo-tag{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
/* shell */
#app{position:relative;z-index:1;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
#app[hidden]{display:none}
nav.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--navbg);backdrop-filter:blur(10px)}
nav.side .logo{padding:0 8px 18px;font-size:17px}nav.side .logo i{width:36px;height:36px;font-size:17px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:500;position:relative;transition:background .2s,color .2s}
.nv svg{width:20px;height:20px;flex:none}
.nv:hover{background:var(--panel);color:var(--text)}
.nv.on{background:linear-gradient(90deg,rgba(227,168,87,.16),rgba(227,168,87,.04));color:var(--accent)}
.nv.on::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.nv .bd{margin-left:auto;background:var(--accent);color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;min-width:22px;height:22px;display:none;place-items:center;padding:0 6px}
.nv .bd.show{display:grid;animation:pop .4s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:none}}
.side .sp{flex:1}
.shop{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:13px}
.shop b{display:block;font-size:14px}
.shop .live{display:flex;align-items:center;gap:8px;color:var(--ok);margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
main{padding:0 32px 60px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:24px}
.top h1{font-size:clamp(22px,3vw,30px)}
.top .sub{color:var(--muted);margin-top:4px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card h3{font-size:15px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font:700 clamp(24px,2.6vw,32px) var(--disp);margin:8px 0 6px;letter-spacing:-.02em}
.kpi .d{font-size:13px;display:flex;align-items:center;gap:6px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:9px;font-weight:600;font-size:13px}
.tabs button.on{background:var(--panel2);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;transition:all .2s}
.chip:hover{border-color:var(--accent);color:var(--text)}.chip.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:rgba(123,196,127,.4);background:rgba(123,196,127,.08)}
.badge.warn{color:var(--warn);border-color:rgba(232,176,74,.4);background:rgba(232,176,74,.08)}
.badge.bad{color:var(--bad);border-color:rgba(224,103,90,.4);background:rgba(224,103,90,.08)}
.badge.info{color:var(--info);border-color:rgba(111,177,217,.4);background:rgba(111,177,217,.08)}
.badge.gold{color:var(--accent);border-color:rgba(227,168,87,.4);background:rgba(227,168,87,.08)}
/* chart */
.bars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:3px;transition:height .7s cubic-bezier(.2,.8,.2,1);position:relative}
.bars .b:hover i{filter:brightness(1.15)}
.bars .b i::after{content:attr(data-v);position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap}
.bars .b:hover i::after{opacity:1}
.bars small{color:var(--muted);font-size:11px}
.bars .b.cur i{background:linear-gradient(180deg,#fff3dc,var(--accent))}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;margin-bottom:12px}
.hrow .bar{grid-column:1/3;height:7px;border-radius:7px;background:var(--panel2);overflow:hidden}
.hrow .bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .8s cubic-bezier(.2,.8,.2,1)}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--colbg);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:300px;transition:border-color .2s,background .2s}
.col.over{border-color:var(--accent);background:rgba(227,168,87,.06)}
.col h3{font:600 13px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.col h3 b{background:var(--panel2);border-radius:999px;padding:2px 10px;color:var(--text)}
.oc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:grab;animation:in .4s}
.oc.fresh{border-color:var(--accent);box-shadow:0 0 0 3px rgba(227,168,87,.14)}
.oc.late{border-color:rgba(224,103,90,.6)}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
.oc .h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.oc .h b{font-family:var(--disp);font-size:14px}
.oc ul{list-style:none;margin:8px 0;padding:0;font-size:14px}
.oc li{display:flex;justify-content:space-between;gap:10px}
.oc .cm{font-size:13px;color:var(--warn);background:rgba(232,176,74,.08);border-radius:8px;padding:6px 10px;margin:8px 0}
.oc .f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.oc .f b{font-size:16px}.oc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line)}
td{padding:13px 16px;border-bottom:1px solid rgba(53,42,32,.6);vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr{transition:background .15s}tbody tr:hover{background:rgba(227,168,87,.04)}
tr.clk{cursor:pointer}td.r,th.r{text-align:right}
.sw{width:44px;height:26px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:background .25s,border-color .25s;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .25s,background .25s}
.sw.on{background:rgba(123,196,127,.2);border-color:rgba(123,196,127,.6)}.sw.on::after{transform:translateX(18px);background:var(--ok)}
.sw.gold.on{background:rgba(227,168,87,.2);border-color:rgba(227,168,87,.6)}.sw.gold.on::after{background:var(--accent)}

var snd={on:true,ctx:null};
function beep(){if(!snd.on)return;try{if(!snd.ctx)snd.ctx=new (window.AudioContext||window.webkitAudioContext)();var c=snd.ctx,t=c.currentTime;[[880,0],[1175,.14]].forEach(function(n){var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=n[0];g.gain.setValueAtTime(0,t+n[1]);g.gain.linearRampToValueAtTime(.18,t+n[1]+.02);g.gain.exponentialRampToValueAtTime(.001,t+n[1]+.35);o.connect(g);g.connect(c.destination);o.start(t+n[1]);o.stop(t+n[1]+.4)})}catch(e){}}
